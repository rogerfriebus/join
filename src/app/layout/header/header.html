<header class="header">
  <p class="header__title">Kanban Project Management Tool</p>

  <div class="header__actions">
    <button class="header__help" type="button" aria-label="Help" (click)="openHelp()">
      <span class="header__help-icon" aria-hidden="true"></span>
    </button>

    @if (isAuthenticated()) {
      <div class="header__user">
        <button
          class="header__avatar"
          type="button"
          aria-label="User menu"
          [attr.aria-expanded]="menuOpen()"
          (click)="toggleMenu()"
        >
          {{ initials() }}
        </button>

        @if (menuOpen()) {
          <button
            class="header__menu-backdrop"
            type="button"
            aria-label="Close user menu"
            (click)="closeMenu()"
          ></button>

          <div class="header__menu" role="menu" aria-label="User submenu">
            <button
              class="header__menu-item header__menu-item--mobile-only"
              type="button"
              role="menuitem"
              (click)="openHelp()"
            >
              Help
            </button>
            <button
              class="header__menu-item"
              type="button"
              role="menuitem"
              (click)="openLegalNotice()"
            >
              Legal Notice
            </button>
            <button
              class="header__menu-item"
              type="button"
              role="menuitem"
              (click)="openPrivacyPolicy()"
            >
              Privacy Policy
            </button>
            <button
              class="header__menu-item"
              type="button"
              role="menuitem"
              (click)="logout()"
            >
              Log out
            </button>
          </div>
        }
      </div>
    }
  </div>
</header>
