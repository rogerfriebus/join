<nav class="navbar" aria-label="Main navigation">
  <a
    class="navbar__brand"
    [routerLink]="isAuthenticated() ? '/summary' : '/login'"
    aria-label="Go to start"
  >
    <img class="navbar__logo" src="/assets/img/join-logo.svg" alt="Join" />
  </a>

  @if (isAuthenticated()) {
    <div class="navbar__links">
      <a class="navbar__link" routerLink="/summary" routerLinkActive="navbar__link--active">
        <span class="navbar__icon navbar__icon--summary" aria-hidden="true"></span>
        <span class="navbar__text">Summary</span>
      </a>

      <a class="navbar__link" routerLink="/add-task" routerLinkActive="navbar__link--active">
        <span class="navbar__icon navbar__icon--add-task" aria-hidden="true"></span>
        <span class="navbar__text">Add Task</span>
      </a>

      <a class="navbar__link" routerLink="/board" routerLinkActive="navbar__link--active">
        <span class="navbar__icon navbar__icon--board" aria-hidden="true"></span>
        <span class="navbar__text">Board</span>
      </a>

      <a class="navbar__link" routerLink="/contacts" routerLinkActive="navbar__link--active">
        <span class="navbar__icon navbar__icon--contacts" aria-hidden="true"></span>
        <span class="navbar__text">Contacts</span>
      </a>
    </div>
  } @else {
    <div class="navbar__links navbar__links--public">
      <a class="navbar__link navbar__link--login" routerLink="/login">
        <span class="navbar__icon navbar__icon--login" aria-hidden="true"></span>
        <span class="navbar__text">Log In</span>
      </a>

      <a
        class="navbar__link navbar__link--public-page"
        routerLink="/help"
        routerLinkActive="navbar__link--active"
      >
        <span class="navbar__text">Help</span>
      </a>

      <a
        class="navbar__link navbar__link--public-page"
        routerLink="/privacy-policy"
        routerLinkActive="navbar__link--active"
      >
        <span class="navbar__text">Privacy Policy</span>
      </a>

      <a
        class="navbar__link navbar__link--public-page"
        routerLink="/legal-notice"
        routerLinkActive="navbar__link--active"
      >
        <span class="navbar__text">Legal Notice</span>
      </a>
    </div>
  }
</nav>
