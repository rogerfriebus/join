<div class="login-page" [class.intro-done]="introComplete">
  <div class="logo-wrapper" [class.logo-final]="!logoAnimating">
    <img src="./assets/img/join-logo-dark.svg" alt="Join Logo" class="logo" />
  </div>

  <header class="login-header">
    <div>
    </div>
    <div class="header-actions">
      <span>Not a Join user?</span>
      <button type="button" class="btn-signup" (click)="goToSignUp()">Sign up</button>
    </div>
  </header>

  <main class="login-main">
    <div class="login-card">

      <div class="card-title">
        <h1>Log in</h1>
        <span class="accent-line"></span>
      </div>

      <div class="form-group">
        <div class="input-wrapper" [class.error]="emailError">
          <input type="email" placeholder="Email" [(ngModel)]="form.email" (ngModelChange)="emailError = ''" />
          <img src="./assets/icons/mail.svg" class="input-icon" />
        </div>
        <span class="field-error" *ngIf="emailError">{{ emailError }}</span>
      </div>

      <div class="form-group">
        <div class="input-wrapper" [class.error]="passwordError">
          <input [type]="showPassword ? 'text' : 'password'" placeholder="Password" [(ngModel)]="form.password"
            (ngModelChange)="passwordError = ''" />
          <img *ngIf="!form.password" src="./assets/icons/lock.svg" class="input-icon" />
          <button *ngIf="form.password" type="button" class="toggle-pw-btn" (click)="togglePasswordVisibility()">
            <img [src]="showPassword ? './assets/icons/visibility.svg' : './assets/icons/visibility_off.svg'"
              class="input-icon" />
          </button>
        </div>
        <span class="field-error" *ngIf="passwordError">{{ passwordError }}</span>
      </div>

      <span class="field-error login-error" *ngIf="loginError">{{ loginError }}</span>

      <div class="card-actions">
        <button type="button" class="btn-login" (click)="login()">Log in</button>
        <button type="button" class="btn-guest" (click)="guestLogin()">Guest Log in</button>
      </div>

    </div>
  </main>

  <div class="signup-mobile">
    <span>Not a Join user?</span>
    <button type="button" class="btn-signup" (click)="goToSignUp()">Sign up</button>
  </div>

  <footer class="login-footer">
    <a routerLink="/privacy-policy">Privacy Policy</a>
    <a routerLink="/legal-notice">Legal notice</a>
  </footer>

</div>
